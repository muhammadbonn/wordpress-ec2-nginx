services:
  # ── Nginx: Acts as a Reverse Proxy to route traffic to WordPress ─────────
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80" # Maps port 80 of the host to port 80 of the container
    volumes:
      # Mapping local configuration files to the container
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress
    networks:
      - app-net

  # ── WordPress: The Application Layer ──────────────────────────────────────
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always
    depends_on:
      db:
        condition: service_healthy # Only starts when the database is ready
    env_file:
      - .env # Loads environment variables from the .env file
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "80" # Exposed internally within the network, not to the host directly
    networks:
      - app-net

  # ── Database: MariaDB to store WordPress data ────────────────────────────
  db:
    image: mariadb:10.6.4-focal
    container_name: db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      - db_data:/var/lib/mysql # Persistent storage for database files
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    networks:
      - app-net
    healthcheck:
      # Ensures the database is fully functional before WordPress connects
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# Persistent volumes for data integrity
volumes:
  db_data:

# Internal network for container-to-container communication
networks:
  app-net:
    driver: bridge
