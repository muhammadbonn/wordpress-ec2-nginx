# Configuration for the WordPress Reverse Proxy
server {
    listen 80;

    location / {
        # Forward requests to the 'wordpress' service container on port 80
        proxy_pass http://wordpress:80;

        # Standard headers to pass the original user info to WordPress
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Performance tuning: adjust timeouts for slower backend responses
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
