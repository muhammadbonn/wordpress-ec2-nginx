# Global Nginx settings
events {
    worker_connections 1024; # Standard number of simultaneous connections
}

http {
    # Include MIME types for proper file rendering (CSS, JS, etc.)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimization for sending files
    sendfile on;
    keepalive_timeout 65;

    # Standard logging paths within the container
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Include all virtual host configurations from the conf.d directory
    include /etc/nginx/conf.d/*.conf;
}
